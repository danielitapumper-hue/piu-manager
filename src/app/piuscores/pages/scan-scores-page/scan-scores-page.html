<div class="flex flex-col w-full max-w-5xl mx-auto pb-12">
  <app-title [title]="'Escanear Scores'"
    [subTitle]="'Sube capturas de tus puntuaciones para escanearlas de forma automática. Puedes subir varias imágenes en simultáneo. Las imágenes no se almacenarán en ningún servidor.'" />

  <providers-key-config />

  <div class="form-control w-full max-w-xs mb-4">
    <label class="label">
      <span class="label-text">Versión</span>
    </label>
    <select class="select select-primary" [value]="mix()" (change)="mix.set($any($event.target).value)">
      @for (option of mixOptions; track option) {
      <option [value]="option">{{ option }}</option>
      }
    </select>
  </div>

  @if(hasActiveApiKey()) {
  <upload-images (files)="processFiles($event)" />

  <process-images [files]="filesList()" [mix]="mix()" />
  }
</div>
